<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | King Ali Store</title>

<link rel="stylesheet" href="style.css">

<style>
body {
  background:#111;
  color:#fff;
  margin:0;
  font-family:Arial,sans-serif;
}

header {
  background:#000;
  padding:18px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.logo {
  color:#d4af37;
  font-size:28px;
  font-weight:bold;
}

nav a {
  color:#fff;
  text-decoration:none;
  margin:0 10px;
}

.hero {
  text-align:center;
  padding:60px 8%;
}

.hero h1 {
  color:#d4af37;
  font-size:42px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:40px 8%;
}

.card {
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:10px;
  padding:20px;
}

.card img {
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:8px;
}

.btn {
  display:inline-block;
  background:#d4af37;
  color:#111;
  padding:12px 20px;
  border-radius:6px;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

footer {
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">King Ali Store</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart 🛒</a>
    <a href="checkout.html">Checkout</a>
  </nav>
</header>

<section class="hero">
  <h1>King Ali Store</h1>
  <p>Shop our latest products</p>
</section>

<section class="grid" id="products">
  <div class="card">
    <h3>Welcome to King Ali Store</h3>
    <p>Your products will appear here after you add them.</p>
  </div>
</section>

<footer>
  © 2026 King Ali Store
</footer>

<script src="script.js"></script>

</body>
</html>
